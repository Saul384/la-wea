<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión en la consola IDGS17</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Misma identidad que el frontend: "el token es un pase de acceso". */
    :root {
      --bg: #EEF2F7; --surface: #FFFFFF; --line: #D2DAE5;
      --text: #1B2638; --text-2: #4A5870; --text-3: #66758C;
      --brand: #0B5FA5; --brand-hover: #094E88; --on-brand: #FFFFFF;
      --cyan: #29A9E1; --err: #C4352B; --err-bg: #FBE4E1; --info-bg: #E1EEF9;
      --focus: 0 0 0 3px rgba(11, 95, 165, .35);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0F1828; --surface: #16223A; --line: #2A3A58;
        --text: #E6ECF5; --text-2: #A9B6CC; --text-3: #8494AD;
        --brand: #5AA6E6; --brand-hover: #79B8EC; --on-brand: #0B1A2E;
        --cyan: #4CC0EE; --err: #EE7D6B; --err-bg: #3A1A16; --info-bg: #142C47;
        --focus: 0 0 0 3px rgba(90, 166, 230, .45);
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.5 'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--brand); }

    .page {
      min-height: 100%; display: grid; align-content: center; justify-items: start;
      gap: 24px; width: min(100% - 32px, 520px); margin: 0 auto; padding: 48px 0;
    }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; color: var(--text); text-decoration: none; }
    .mark { width: 22px; height: 14px; border-radius: 3px; background: linear-gradient(90deg, var(--cyan) 0 38%, var(--brand) 38% 100%); }

    /* El pase, todavía por emitir: el formulario va dentro */
    .pass {
      --stub: 76px;
      position: relative; width: 100%;
      display: grid; grid-template-columns: var(--stub) 1fr;
      background: var(--surface); border-radius: 16px;
      box-shadow: 0 1px 0 var(--line), 0 16px 40px -22px rgba(11, 58, 102, .5);
    }
    .stub {
      display: grid; place-items: center; border-radius: 16px 0 0 16px;
      background: var(--cyan); color: #fff; font-size: 40px; font-weight: 800;
    }
    .body {
      position: relative; padding: 28px 28px 26px;
      border-left: 2px dashed var(--line); display: grid; gap: 14px;
    }
    .body::before, .body::after {
      content: ''; position: absolute; left: -11px; width: 20px; height: 20px;
      border-radius: 50%; background: var(--bg);
    }
    .body::before { top: -10px; }
    .body::after { bottom: -10px; }

    h1 { margin: 0 0 4px; font-size: 34px; line-height: 1.1; font-weight: 800; letter-spacing: -.025em; }

    .field { display: grid; gap: 6px; }
    label { font-size: 14px; font-weight: 600; }
    input {
      width: 100%; height: 46px; padding: 0 14px; border-radius: 8px;
      border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit;
    }
    input:focus { outline: none; border-color: var(--brand); box-shadow: var(--focus); }
    .alert ~ .field input { border-color: var(--err); }

    .pw { position: relative; }
    .pw input { padding-right: 92px; }
    .toggle {
      position: absolute; right: 6px; top: 6px; height: 34px; padding: 0 12px;
      border: 0; border-radius: 6px; background: transparent; color: var(--brand);
      font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .toggle:hover { background: var(--info-bg); }
    .toggle:focus-visible { outline: none; box-shadow: var(--focus); }

    .submit {
      margin-top: 6px; height: 50px; border: 0; border-radius: 8px;
      background: var(--brand); color: var(--on-brand);
      font: inherit; font-weight: 700; cursor: pointer;
    }
    .submit:hover { background: var(--brand-hover); }
    .submit:focus-visible { outline: none; box-shadow: var(--focus); }
    .submit:disabled { opacity: .75; cursor: progress; }

    .alert, .note { margin: 0; padding: 12px 14px; border-radius: 8px; font-size: 14px; border-left: 3px solid; }
    .alert { background: var(--err-bg); border-color: var(--err); }
    .note { background: var(--info-bg); border-color: var(--brand); }

    .back { font-size: 14px; color: var(--text-2); }
    .back:hover { color: var(--text); }

    @media (max-width: 480px) {
      .pass { grid-template-columns: 1fr; }
      .stub { height: 56px; border-radius: 16px 16px 0 0; font-size: 28px; }
      .body { border-left: 0; border-top: 2px dashed var(--line); padding: 24px 18px 20px; }
      .body::before { top: -11px; left: -10px; }
      .body::after { top: -11px; bottom: auto; left: auto; right: -10px; }
      h1 { font-size: 28px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="brand" th:href="${frontendUrl} + '/login'" href="http://localhost:3000/login">
      <span class="mark" aria-hidden="true"></span>Consola IDGS17
    </a>

    <section class="pass" aria-labelledby="title">
      <div class="stub" aria-hidden="true">?</div>

      <form class="body" th:action="@{/login}" method="post" id="login-form">
        <h1 id="title">Iniciar sesión</h1>

        <p th:if="${param.error}" class="alert" role="alert">
          Usuario o contraseña incorrectos.
        </p>
        <p th:if="${param.logout}" class="note" role="status">Cerraste sesión.</p>

        <div class="field">
          <label for="username">Usuario</label>
          <input id="username" name="username" type="text" autocomplete="username"
                 autocapitalize="none" spellcheck="false" required autofocus>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <div class="pw">
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="button" class="toggle" aria-controls="password" aria-pressed="false">Mostrar</button>
          </div>
        </div>

        <button type="submit" class="submit">Iniciar sesión</button>
      </form>
    </section>

    <a class="back" th:href="${frontendUrl} + '/login'" href="http://localhost:3000/login">Volver a la consola</a>
  </main>

  <script>
    (function () {
      var input = document.getElementById('password');
      var toggle = document.querySelector('.toggle');
      toggle.addEventListener('click', function () {
        var show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        toggle.textContent = show ? 'Ocultar' : 'Mostrar';
        toggle.setAttribute('aria-pressed', String(show));
        input.focus();
      });
      document.getElementById('login-form').addEventListener('submit', function (e) {
        var btn = e.target.querySelector('.submit');
        btn.disabled = true;
        btn.textContent = 'Entrando…';
      });
    })();
  </script>
</body>
</html>
