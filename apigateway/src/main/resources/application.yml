server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://eurekaserver:8761/eureka/
spring:
  application:
    name: gateway
cloud:
  gateway:
    server:
      webmvc:
        routes:
          - id: msa
            uri: lb://msa
            predicates:
              - Path=/api/entity-a/**
            filters:
              - StripPrefix=0
          - id: msb
            uri: lb://microb
            predicates:
                - Path=/api/entity-b/**
            filters:
              - StripPrefix=0
    